name: Instagram Downloader (با کوکی)

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: 'لینک پست یا ریل اینستاگرام'
        required: true
        type: string
      password:
        description: 'رمز عبور برای فایل‌های zip (اختیاری)'
        required: false
        default: ''

jobs:
  download-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yt-dlp
        run: |
          pip install --upgrade yt-dlp
          yt-dlp -U  # آپدیت به آخرین نسخه

      - name: Setup Cookies
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          if [ -n "$INSTAGRAM_COOKIES" ]; then
            echo "$INSTAGRAM_COOKIES" > /tmp/cookies.txt
            echo "COOKIES_FILE=/tmp/cookies.txt" >> "$GITHUB_ENV"
            echo "Cookies configured successfully"
          else
            echo "WARNING: No cookies found! Download may fail."
          fi

      - name: Download Instagram Post/Reel
        run: |
          URL="${{ github.event.inputs.instagram_url }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"
          
          mkdir -p downloads/instagram
          cd downloads/instagram
          
          echo "Downloading: $URL"
          
          # ساخت آرگومان‌های yt-dlp
          COOKIES_ARGS=""
          if [ -n "${COOKIES_FILE:-}" ] && [ -f "${COOKIES_FILE:-/dev/null}" ]; then
            COOKIES_ARGS="--cookies $COOKIES_FILE"
          fi
          
          # تلاش با روش‌های مختلف
          yt-dlp \
            $COOKIES_ARGS \
            --no-playlist \
            --format "best" \
            --output "%(title)s_%(id)s.%(ext)s" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            --add-header "Accept-Language: en-US,en;q=0.9" \
            --retries 5 \
            --sleep-requests 2 \
            "$URL" || {
              echo "Method 1 failed, trying method 2..."
              yt-dlp \
                $COOKIES_ARGS \
                --no-playlist \
                --format "best" \
                --output "%(title)s_%(id)s.%(ext)s" \
                --extractor-args "instagram:api" \
                "$URL"
            }
          
          echo "Download complete!"
          
      - name: List files
        run: |
          echo "Files downloaded:"
          ls -la downloads/instagram/
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-content
          path: downloads/instagram/
          retention-days: 7
